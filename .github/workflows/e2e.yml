name: e2e

# 全栈验收：真起基础设施 + 四个 Java 服务 + 引擎，再打 gateway 跑 e2e/。
# 单测覆盖不到的跨服务行为（SSE、跨租户 404、审批续跑、评测收口）只在这条流水线里回归。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # pom 决定 springdoc 版本与 info.version：只改根 pom / 子模块 pom 也会让
      # 四份 java-*.json 漂移，早期漏列这两条会让这类 PR 完全不触发精查。
      - "pom.xml"
      - "**/pom.xml"
      - "engine-api/**"
      - "workflow-service/**"
      - "agent-gateway/**"
      - "connector-service/**"
      - "audit-service/**"
      - "common/**"
      - "db/**"
      - "e2e/**"
      - "scripts/seed-demo.sql"
      - "scripts/dump-openapi-java.py"
      - "scripts/check-java-routes.py"
      - "docs/openapi/**"
      - "ops/docker-compose.infra.yml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 基础设施（MySQL / PG / Redis / RocketMQ）
        run: |
          docker compose -f ops/docker-compose.infra.yml up -d \
            mysql postgres redis rocketmq-namesrv rocketmq-broker
          # broker 必须等到 healthy：服务启动时会连 namesrv 建 producer，
          # broker 没起来审计消息就发不出去（业务侧只记日志不阻断）。
          timeout 240 bash -c \
            'until [ "$(docker inspect -f "{{.State.Health.Status}}" agentflow-rmq-broker 2>/dev/null)" = healthy ]; do sleep 2; done'
          timeout 180 bash -c \
            'until [ "$(docker inspect -f "{{.State.Health.Status}}" agentflow-mysql)" = healthy ]; do sleep 2; done'
          # 预建 topic：autoCreateTopicEnable 只在首条消息时建 topic；
          # 消费端在此之前查路由会拿到 17（No topic route info）
          for t in af-audit-event af-gate-decision; do
            docker exec agentflow-rmq-broker sh -c \
              "sh mqadmin updateTopic -n 127.0.0.1:9876 -c DefaultCluster -t $t" >/dev/null 2>&1 || true
          done

      - name: 迁移 + 最小授权 + 种子
        run: |
          docker compose -f ops/docker-compose.infra.yml run --rm --no-deps flyway
          docker compose -f ops/docker-compose.infra.yml run --rm --no-deps grants
          docker exec -i agentflow-mysql \
            mysql --default-character-set=utf8mb4 -uroot -proot agentflow < scripts/seed-demo.sql

      - name: 构建 Java 服务
        run: mvn -B -ntp -DskipTests -Dcheckstyle.skip package

      - name: 安装引擎依赖
        working-directory: engine-api
        run: pip install -e ".[dev]"

      - name: 启动引擎与四个服务
        env:
          AF_INTERNAL_TOKEN: dev-internal-token
          AF_JWT_SECRET: dev-only-secret-key-0123456789abcdef
          AF_COOKIE_SECURE: "false"
          AF_RATE_LIMIT_TRIGGER_MAX: "300"
          AF_RATE_LIMIT_LOGIN_MAX: "300"
          # 审计链路（workflow → RocketMQ → audit）必须真跑：关掉时 workflow-service
          # 用 NoopAuditPublisher，灰度/发布类审计事件不会落库，e2e 会误判为通过。
          AF_MQ_ENABLED: "true"
          AF_ROCKETMQ_NAMESRV: 127.0.0.1:9876
          # 产品侧不允许离线 provider，CI 也没有密钥，所以起一个本地 OpenAI 兼容端点
          # 冒充上游（e2e/support/fake_openai.py）。引擎仍走真实 HTTP：真实的超时、
          # 真实的错误分类、真实按 usage 计量 token，只是对端在 127.0.0.1。
          AF_LLM_BASE_URL: http://127.0.0.1:8099/v1
          AF_LLM_API_KEY: ci-test-key
          AF_LLM_MODEL: deepseek-chat
          AF_LLM_ALLOW_INSECURE_HTTP: "true"
        run: |
          mkdir -p logs
          # 先起替身端点：引擎启动时读取 AF_LLM_*，端点没在听会让首个 llm 节点 ConnectError。
          nohup python e2e/support/fake_openai.py --port 8099 \
            > logs/fake-llm.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8099/health >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8099/health >/dev/null \
            || { echo "替身模型端点未就绪"; cat logs/fake-llm.log; exit 1; }
          cd engine-api
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > ../logs/engine.log 2>&1 &
          cd ..
          for svc in workflow-service agent-gateway audit-service connector-service; do
            jar="$(ls -t "$svc"/target/"$svc"-*.jar | grep -v '\.original$' | head -1)"
            nohup java -jar "$jar" > "logs/$svc.log" 2>&1 &
          done
          # 三件事都要成立才算就绪：引擎活着、网关（连带 Redis 探活）返回 UP、
          # 且网关能真正转发到 workflow-service（登录接口返回业务 4xx 而不是 5xx/连接失败）。
          for i in $(seq 1 60); do
            engine="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/internal/health || true)"
            ready="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health || true)"
            login="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:8080/api/v1/auth/login \
              -H 'Content-Type: application/json' -d '{}' || true)"
            if [ "$engine" = "200" ] && [ "$ready" = "200" ] \
              && { [ "$login" = "400" ] || [ "$login" = "401" ] || [ "$login" = "422" ]; }; then
              echo "stack up after ~$((i * 2))s (engine=$engine ready=$ready login=$login)"
              exit 0
            fi
            sleep 2
          done
          echo "全栈未在 120s 内就绪 (engine=$engine ready=$ready login=$login)"
          exit 1

      - name: e2e（全栈验收）
        env:
          AF_E2E_BASE_URL: http://127.0.0.1:8080
        run: pytest -q e2e

      # 四个 Java 服务的 spec 由 springdoc 在运行时生成；这条流水线已经把服务起好了，
      # 直接抓 /v3/api-docs 和入库基线比对，避免再为一份文档单独起一套基础设施。
      # 这是「精查」：连请求/响应 schema 一起比。contract-drift 里的 java-route-guard
      # 是「粗筛」：不等起服务，从 Controller 源码秒级比对路由集合，堵住 e2e 未触发
      # 或排队被取消时的检查真空。
      - name: Java OpenAPI 漂移检查（运行时全量 spec）
        run: python scripts/dump-openapi-java.py --check

      - name: 失败时收集日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: logs/*.log
          if-no-files-found: ignore
