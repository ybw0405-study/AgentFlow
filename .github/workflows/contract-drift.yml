name: contract-drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需读取源码，杜绝 GITHUB_TOKEN 被滥用
permissions:
  contents: read

jobs:
  engine-openapi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: install engine (locked)
        working-directory: engine-api
        run: pip install -r requirements.lock.txt
      - name: dump openapi
        run: python scripts/dump-openapi.py
      - name: diff against committed baseline
        run: git diff --exit-code -- docs/openapi/engine-api.json
