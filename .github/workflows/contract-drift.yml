name: contract-drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需读取源码，杜绝 GITHUB_TOKEN 被滥用
permissions:
  contents: read

# 同一 ref 上的重跑/新推送取消在途任务，避免排队积压与陈旧检查结论
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-openapi:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version  # G12
          cache: pip
          cache-dependency-path: engine-api/requirements.lock.txt  # G20：真实锁文件
      - name: install engine (locked + verified hashes)
        working-directory: engine-api
        # G15：与 python-ci 同一套 --require-hashes 安装口径
        run: |
          pip install --require-hashes -r requirements.lock.txt
          pip install --no-deps -e .
      - name: dump openapi
        run: python scripts/dump-openapi.py
      - name: diff against committed baseline
        run: git diff --exit-code -- docs/openapi/engine-api.json

  # Java 侧的四份基线由 springdoc 运行时生成，全量 --check 只能等 e2e 起全栈。
  # 这里补一层零依赖的静态粗筛：不启动 Spring，直接比对 Controller 源码里的
  # 路由集合与入库基线，秒级拦住「改了接口却没刷基线」。PR 只改 pom/Controller、
  # e2e 因排队或 cancel-in-progress 未跑时，检查不再完全真空。
  # 参数/响应 schema 的漂移仍由 e2e 的运行时 --check 负责，两者互补不重复。
  java-route-guard:
    name: Java 路由粗筛（秒级，无需起服务）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version  # G12
      - name: 静态比对 Controller 路由与入库基线
        run: python scripts/check-java-routes.py

  # 迁移新增表若忘记补最小授权，生产首次部署即 permission denied，审计还会静默丢失。
  # 零依赖静态对账 CREATE TABLE 集合与 GRANT 集合，并校验权限语义（audit_event 只追加）。
  grant-guard:
    name: 最小授权脚本与迁移表集合对账
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version  # G12
      - name: 迁移表集合 == grants 表集合（含权限语义）
        run: python scripts/check-grants.py
