name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需读取源码，杜绝 GITHUB_TOKEN 被滥用
permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc # 与根目录版本文件对齐
          cache: npm
          cache-dependency-path: frontend/package-lock.json # 真实锁文件
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # OpenAPI 是唯一契约源，前端类型必须由它生成，且生成物不得被手写漂移。
      - name: 生成 API 类型（OpenAPI 单源）
        working-directory: frontend
        run: npm run gen:api-types
      - name: 生成物不得漂移
        run: git diff --exit-code -- frontend/src/types/api.generated.ts
      - name: typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: lint
        working-directory: frontend
        run: npm run lint
      - name: test
        working-directory: frontend
        run: npm run test
      - name: build
        working-directory: frontend
        run: npm run build
