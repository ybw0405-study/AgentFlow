name: python-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: install
        working-directory: engine-api
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: engine-api
        run: ruff check app tests
      - name: ruff format --check
        working-directory: engine-api
        run: ruff format --check app tests
      - name: pytest (unit + integration, testcontainers 自举 PG)
        working-directory: engine-api
        run: pytest -q
