name: config-guard

# ops/、scripts/、docs/ 此前没有任何 job。这里让这三类目录的改动有真实门禁：
# pull_request.paths 显式列出它们及 workflow 自身；push main 无条件跑。
# 校验项都是硬失败：compose 可解析且镜像按 digest 固定、全部 workflow YAML
# safe_load 通过且每条 workflow 保留 timeout/permissions/concurrency、
# action 无浮动 @vN、无 continue-on-error、无恒真兜底、scripts 语法自检。
# 不使用 continue-on-error 或恒真兜底绕过。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "ops/**"
      - "scripts/**"
      - "docs/**"
      - "db/mysql/migration/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - ".nvmrc"
      - ".python-version"
      - ".java-version"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-guard:
    name: ops / scripts / docs 配置守卫
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: 安装 PyYAML
        run: python -m pip install --quiet pyyaml

      - name: docker compose config（含 G16 digest 固定）
        run: docker compose -f ops/docker-compose.infra.yml config --quiet

      - name: 迁移不可变门禁（已发布迁移禁止修改）
        run: python scripts/check_migration_immutability.py

      - name: workflow / compose 静态门禁
        run: |
          python - <<'PY'
          import glob
          import re
          import sys
          from pathlib import Path
          import yaml

          errors = []
          workflows = sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml'))
          if not workflows:
              errors.append('没有找到任何 workflow YAML')

          for path in workflows:
              text = Path(path).read_text(encoding='utf-8')
              try:
                  doc = yaml.safe_load(text)
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: yaml.safe_load 失败: {exc}')
                  continue
              if not isinstance(doc, dict):
                  errors.append(f'{path}: 顶层不是 mapping')
                  continue
              for key in ('permissions', 'concurrency'):
                  if key not in doc:
                      errors.append(f'{path}: 缺少顶层 {key}')
              for job_name, job in (doc.get('jobs') or {}).items():
                  if not isinstance(job, dict) or 'timeout-minutes' not in job:
                      errors.append(f'{path}: job {job_name} 缺少 timeout-minutes')
              # 逐行检查 uses: 步骤，避免匹配到本脚本内嵌的正则字面量
              for line in text.splitlines():
                  if re.match(r'\s*-\s*uses:\s*[^\s#]+@(?:v\d|main|master)', line):
                      errors.append(f'{path}: 存在浮动 tag / 分支 action 引用（必须为 40 位 SHA）')
              if re.search(r'^\s*continue-on-error\s*:', text, re.M):
                  errors.append(f'{path}: 存在 continue-on-error（禁止绕过门禁）')
              if re.search(r'\|\|\s*true', text):
                  errors.append(f'{path}: 存在恒真兜底（禁止绕过门禁）')

          # Dockerfile 的基础镜像必须全部按 digest 固定（含构建期 ARG 注入的 python）。
          dockerfile = Path('Dockerfile').read_text(encoding='utf-8')
          df_lines = dockerfile.splitlines()
          first_from = next((i for i, l in enumerate(df_lines)
                             if l.strip().startswith('FROM ')), len(df_lines))
          # 全局 ARG 必须在第一个 FROM 之前声明；放在 stage 内时 FROM 行读到空值，构建失败。
          # 允许带默认 digest（本地构建开箱即用，CI 构建期覆盖）；带默认值时必须是真实 sha256。
          arg_lines = [(i, l.strip()) for i, l in enumerate(df_lines)
                       if l.strip().startswith('ARG PYTHON_BASE_DIGEST')]
          arg_global = any(i < first_from for i, _ in arg_lines)
          if not arg_lines:
              errors.append('Dockerfile: 缺少 PYTHON_BASE_DIGEST 构建参数声明')
          elif not arg_global:
              errors.append('Dockerfile: ARG PYTHON_BASE_DIGEST 必须声明在第一个 FROM 之前（全局作用域），否则 FROM 行无法解析 digest')
          for _, decl in arg_lines:
              if '=' in decl and not re.search(r'=\s*sha256:[0-9a-f]{64}\s*$', decl):
                  errors.append(f'Dockerfile: PYTHON_BASE_DIGEST 默认值必须是真实 sha256 digest: {decl}')
          for line in df_lines:
              stripped = line.strip()
              if not stripped.startswith('FROM '):
                  continue
              ref = stripped.split()[1]
              if ref in ('java-base', 'python-base'):
                  continue
              # python 基础镜像走 ARG 注入真实 digest（release.yml 构建期解析），
              # 常量 digest 与其它镜像走字面 @sha256: 校验。
              if ref == 'python:3.13-slim@${PYTHON_BASE_DIGEST}':
                  continue
              if '@sha256:' not in ref:
                  errors.append(f'Dockerfile: 基础镜像未按 digest 固定: {ref}')
          if 'FROM python:3.13-slim@${PYTHON_BASE_DIGEST}' not in dockerfile:
              errors.append('Dockerfile: python 基础镜像必须写为 python:3.13-slim@${PYTHON_BASE_DIGEST}')

          compose = yaml.safe_load(Path('ops/docker-compose.infra.yml').read_text(encoding='utf-8'))
          for name, service in (compose.get('services') or {}).items():
              image = service.get('image', '')
              if '@sha256:' not in image:
                  errors.append(f'ops/docker-compose.infra.yml: 服务 {name} 的镜像未按 digest 固定: {image}')

          if errors:
              print('配置守卫失败：', file=sys.stderr)
              for item in errors:
                  print(f' - {item}', file=sys.stderr)
              sys.exit(1)
          print(f'配置守卫通过：{len(workflows)} 个 workflow、compose 镜像全部按 digest 固定。')
          PY

      - name: scripts/ Python 语法自检
        run: python -m compileall -q scripts

      - name: scripts/ shell 语法自检
        run: |
          for f in scripts/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || exit 1
          done

  # 弱凭据泄漏门禁：仓库内不得出现可被直接利用的明文 dev 口令/内部令牌。
  # 只允许命中「显式标注为占位符/示例」的写法（CHANGE_ME、<...>、$... 环境变量引用），
  # 一旦有人把真实弱口令写进源码/配置/脚本，本 job 在 PR 阶段即失败。
  secret-leak-guard:
    name: dev 弱凭据泄漏门禁
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 扫描仓库内明文弱凭据
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          # 需要强化的危险字面量：真实弱口令 / 弱内部令牌 / 明文 root 口令
          patterns = [
              (r'-p\s*(root|password|admin|agentflow|123456)\b', '明文 root/弱口令连接命令'),
              (r"(?i)\bpassword\s*=\s*['\"](?!.*(CHANGE_ME|\\$\\{|\u003c|\u003c)).*['\"]", '疑似明文密码赋值'),
          ]
          # 目标文件类型
          exts = {'.sql', '.yml', '.yaml', '.py', '.sh', '.properties', '.java', '.md'}
          skip_dirs = {'.git', 'target', 'node_modules', '.venv', 'dist', '__pycache__', '.ruff_cache', '.pytest_cache'}

          # 本地开发豁免清单（逐条显式登记，宁可窄不可宽）：
          # 这些是本地 infra 的引导凭据 / 公开文档里的演示账号 / 测试夹具，
          # 不是生产凭据；生产路径一律环境变量注入（见 SECURITY.md）。
          # 新增豁免必须在此写明理由；清单之外的命中仍然硬失败。
          dev_allowlist = [
              ('ops/docker-compose.infra.yml', '-proot'), # 本地 MySQL 容器引导口令 root/root
              ('scripts/start-dev.sh', '-proot'), # 同上，宿主机重放授权/种子
              ('scripts/gen-seed.py', '-proot'), # 注释里的用法示例
              ('.github/workflows/e2e.yml', '-proot'), # CI 临时容器，跑完即毁
              ('e2e/conftest.py', 'agentflow123'), # 演示账号口令，README 公开
              ('scripts/check_migrations_idempotent.py', 'afidem'),# 一次性临时测试库口令
              ('.github/workflows/config-guard.yml', '-proot'), # 本豁免清单自身的字面量
          ]

          errors = []
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.suffix.lower() not in exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              rel = path.as_posix()
              for idx, (pat, label) in enumerate(patterns):
                  for m in re.finditer(pat, text):
                      line_no = text[:m.start()].count('\n') + 1
                      line = text.splitlines()[line_no - 1] if text.splitlines() else ''
                      if any(rel == f and marker in line for f, marker in dev_allowlist):
                          continue
                      errors.append(f'{path}:{line_no} [{label}] -> {line.strip()[:100]}')

          if errors:
              print('弱凭据泄漏门禁失败：', file=sys.stderr)
              for item in errors:
                  print(f' - {item}', file=sys.stderr)
              sys.exit(1)
          print('弱凭据泄漏门禁通过：未发现可被直接利用的明文弱口令/弱令牌。')
          PY

  # 方案要求「空库 + 已迁移库各重放一次」与「迁移后跨表一致性」
  # 纳入 CI。两个脚本都带 --require-* 强制真库，禁止无库时靠静态审计蒙混过关；
  # build_executor 会在 runner 上自动起临时 mysql:8.4 容器并自行清理。
  migration-guard:
    name: 迁移幂等与跨表一致性（真库）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: 空库 + 已迁移库各重放一次
        run: python scripts/check_migrations_idempotent.py --require-replay
      - name: 跨表引用一致性（真库）
        run: python scripts/check_cross_table_consistency.py --require-db --bootstrap-migrations
