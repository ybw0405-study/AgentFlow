name: java-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需读取源码，杜绝 GITHUB_TOKEN 被滥用
permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn verify (tests + checkstyle + ArchUnit)
        run: mvn -B -ntp verify
