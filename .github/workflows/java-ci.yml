name: java-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限：CI 只需读取源码，杜绝 GITHUB_TOKEN 被滥用
permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17' # 与根目录 .java-version / pom.xml <java.version> 一致
          cache: maven
      - name: mvnw verify (tests + checkstyle + ArchUnit)
        # 用仓库内 Maven wrapper（.mvn/wrapper/maven-wrapper.properties 固定版本），
        # 不依赖 runner 预装的 mvn 版本；与 DocQA 统一使用 ubuntu-latest。
        run: bash ./mvnw -B -ntp verify
