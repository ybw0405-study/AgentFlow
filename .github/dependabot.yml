version: 2

# 依赖更新策略（与 CONTRIBUTING「依赖升级」一致）
# - 每个生态按月检查，最多同时 5 个「版本更新」PR（open-pull-requests-limit: 5）。
# - 主版本升级由维护者手工评估：下面的 ignore 把 semver-major 全部排除，
#   次版本 / 补丁版本按生态聚合成一个 PR（groups），便于集中评审后合入。
# - 安全更新（Dependabot security updates / alerts）是**仓库级开关**，需在
#   GitHub Settings → Code security 单独启用，本文件只管「版本更新」，不再声称
#   「只自动提安全更新」。旧配置三处 open-pull-requests-limit: 0 实际会关闭全部
#   版本更新 PR（并非「只关大版本」），且缺 pip / docker 生态，文件头注释与实配
#   不符，均已纠正。
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(java)"
    labels:
      - "dependencies"
    groups:
      maven-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Spring Boot / Cloud 的 minor 是 feature train（calver），跨 train 有制品改名等
      # 破坏性变化（PR #20 实证：gateway-mvc 在新 train 改名致 POM 解析失败）；
      # jjwt 处于 0.x，minor 即 breaking。三者只放行 patch，train 升级手工迁移。
      - dependency-name: "org.springframework.boot:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "org.springframework.cloud:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "io.jsonwebtoken:*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(frontend)"
    labels:
      - "dependencies"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "pip"
    directory: "/engine-api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(python)"
    labels:
      - "dependencies"
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    # 仅安全更新，不做版本更新 PR：复合 tag 会让 dependabot 漏判运行时大版本
    # （PR #24 实证：maven:3.9-eclipse-temurin-17→26 只被识别为 maven 3.9 的 patch，
    # 实为 Java 17→26；python 3.12→3.15 同样与钉扎的运行时矩阵脱节）。
    # 基础镜像升级由维护者手工评估并按真实 digest 钉扎（Dockerfile 与 compose 同策）。
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(docker)"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
