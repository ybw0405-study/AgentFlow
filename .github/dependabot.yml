version: 2

# 只自动提安全更新：版本升级由人工按 CONTRIBUTING「依赖升级」处理，
# 避免大版本跳跃未经评估就进入主分支（open-pull-requests-limit: 0 仅关闭常规版本 PR）。
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
