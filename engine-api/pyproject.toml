[project]
name = "agentflow-engine"
version = "0.4.0"
description = "AgentFlow execution engine (data plane)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "jinja2>=3.1",
    "simpleeval>=1.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "RUF"]
# S = flake8-bandit：禁 eval/exec（S307/S102）等，属工程门禁
# RUF001/002/003 是「歧义全角字符」规则，与中文注释/文档冲突，关闭
ignore = ["S104", "RUF001", "RUF002", "RUF003"]  # S104: 监听 0.0.0.0 由部署层控制

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 显式声明，避免 pytest-asyncio 未来版本把默认 loop scope 改为 function 导致行为漂移
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: 需要 ephemeral docker 容器的集成测试"]
