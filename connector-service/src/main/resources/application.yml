server:
  port: ${AF_CONNECTOR_PORT:8085}

spring:
  application:
    name: connector-service
  datasource:
    url: jdbc:mysql://${AF_MYSQL_HOST:127.0.0.1}:${AF_MYSQL_PORT:3307}/agentflow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${AF_MYSQL_USER:root}
    password: ${AF_MYSQL_PASSWORD:root}
  data:
    redis:
      url: redis://${AF_REDIS_HOST:127.0.0.1}:${AF_REDIS_PORT:6379}/0
  jackson:
    default-property-inclusion: non_null

agentflow:
  jwt:
    secret: ${AF_JWT_SECRET:dev-only-secret-key-0123456789abcdef}
  internal-token: ${AF_INTERNAL_TOKEN:dev-internal-token}
  credential:
    # 开发默认值（32 字节 base64）；生产必须由 KMS/环境注入，轮换时旧 key_id 仍可解密
    master-key: ${AF_CRED_MASTER_KEY:ZGV2LW9ubHktY3JlZC1tYXN0ZXIta2V5LTMyYnl0ZXM=}
  sandbox:
    allow-insecure-http: ${AF_SANDBOX_ALLOW_HTTP:false}
    allow-loopback: ${AF_SANDBOX_ALLOW_LOOPBACK:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %logger{24} traceId=%mdc{traceId} %msg%n"
