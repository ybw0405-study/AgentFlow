# =============================================================================
# 批次 4 / SLO 定义与告警规则样例 — AgentFlow
# -----------------------------------------------------------------------------
# 【诚实边界】这是**样例**，未接入真实 Prometheus / Alertmanager，未采集任何
# 真实指标，也没有错误预算实测数据。指标名需按 engine-api / 各 Java 服务
# 实际暴露的 metric 校准后再加载。
# 本文件为新增脚手架；**不碰 AgentFlow 任何业务文件**，不改现有源码/脚本/配置。
#
# 用法（真实环境）：
#   promtool check rules drill_slo_alerts.yaml
#   prometheus.rules 段挂 rule_files；slo / error_budget 段供文档与看板消费。
# =============================================================================

slo:
  - name: execution_dispatch_success
    description: 执行提交后被真实派发（202 != 成功，I2）的比例
    sli: "1 - sum(rate(agentflow_dispatch_lost_total[5m])) / sum(rate(agentflow_submit_total[5m]))"
    target: 0.999
    window: 30d
  - name: terminal_immutability
    description: 终态不可逆成功率（乱序/重放事件不改回非终态，I1/AF-2/AF-9）
    sli: "sum(rate(agentflow_terminal_guard_checks_total{result='pass'}[5m])) / sum(rate(agentflow_terminal_guard_checks_total[5m]))"
    target: 1.0
    window: 30d
    note: "硬红线：任何一次终态回写即视为破线"
  - name: lease_takeover_latency
    description: Redis 半开 / 实例关停后租约接管时延（AF-7 / B4）
    sli: "histogram_quantile(0.99, sum(rate(agentflow_lease_takeover_seconds_bucket[5m])) by (le))"
    target_seconds: 30.0
    window: 30d
  - name: projection_lag
    description: 事件流到 MySQL 投影的延迟（单向投影 I1）
    sli: "agentflow_projection_lag_seconds"
    target_seconds: 5.0
    window: 30d
  - name: monthly_quota_consistency
    description: 月度额度账期一致性（Java period == SQL period，AF-5/I5）
    sli: "sum(rate(agentflow_quota_period_checks_total{result='pass'}[5m])) / sum(rate(agentflow_quota_period_checks_total[5m]))"
    target: 1.0
    window: 30d
    note: "跨月窗口（UTC 与 CST 差 8h）为必测点：账本不得劈成两月、不得超发或少算"
  - name: engine_readiness
    description: 引擎 readiness 真实探测（AF-8：探 PG + Redis）
    sli: "agentflow_engine_ready_status"
    target: 1.0
    window: 30d
  - name: preview_no_resume
    description: preview 不因重启/超时被恢复扫描续跑（AF-6）
    sli: "1 - sum(rate(agentflow_preview_resumed_total[5m])) / sum(rate(agentflow_preview_total[5m]))"
    target: 1.0
    window: 30d
  - name: gateway_whitelist
    description: /engine/** 白名单外路径被拒（AF-3）
    sli: "sum(rate(agentflow_gateway_whitelist_checks_total{result='pass'}[5m])) / sum(rate(agentflow_gateway_whitelist_checks_total[5m]))"
    target: 1.0
    window: 30d

error_budget:
  policy: "30d 滚动窗口；灰度任一级消耗 > 20% 预算即停止晋级并评估回滚"
  baseline:
    measured: false
    note: "未接入真实 Prometheus，无错误预算实测值"

# ---- Prometheus 记录 + 告警规则（标准结构，可 promtool 校验）----
prometheus:
  groups:
    - name: agentflow.drill.recording
      interval: 30s
      rules:
        - record: job:agentflow_dispatch_lost_rate:ratio_rate5m
          expr: "sum(rate(agentflow_dispatch_lost_total[5m])) / sum(rate(agentflow_submit_total[5m]))"
        - record: job:agentflow_terminal_guard_pass:ratio_rate5m
          expr: "sum(rate(agentflow_terminal_guard_checks_total{result='pass'}[5m])) / sum(rate(agentflow_terminal_guard_checks_total[5m]))"
        - record: job:agentflow_lease_takeover_p99:seconds
          expr: "histogram_quantile(0.99, sum(rate(agentflow_lease_takeover_seconds_bucket[5m])) by (le))"
        - record: job:agentflow_quota_period_pass:ratio_rate5m
          expr: "sum(rate(agentflow_quota_period_checks_total{result='pass'}[5m])) / sum(rate(agentflow_quota_period_checks_total[5m]))"

    - name: agentflow.drill.alerts
      rules:
        - alert: AgentFlowDispatchLost
          expr: "job:agentflow_dispatch_lost_rate:ratio_rate5m > 0.001"
          for: 5m
          labels:
            severity: critical
            team: agentflow
            batch: "4"
          annotations:
            summary: "控制面显示已触发但引擎无执行（双写语义裂缝，I2 破线）"
            description: "校验 submitExecution 返回体 status/note；引擎未派发应返回 409/5xx 而非 202。"
            runbook: "scripts/drill_canary_rollback_runbook.md 第 4 节"

        - alert: AgentFlowTerminalRewritten
          expr: "job:agentflow_terminal_guard_pass:ratio_rate5m < 1.0 OR increase(agentflow_terminal_rewrite_total[5m]) > 0"
          for: 0m
          labels:
            severity: critical
            team: agentflow
            batch: "4"
          annotations:
            summary: "终态被回写（I1 / AF-2 / AF-9 破线）"
            description: "检查 markTerminal WHERE 前置状态、execution_tracker 终态守卫、Reaper 排除已终态行。"
            runbook: "scripts/drill_canary_rollback_runbook.md 第 4 / 5 节"

        - alert: AgentFlowQuotaPeriodSplit
          expr: "job:agentflow_quota_period_pass:ratio_rate5m < 1.0 OR increase(agentflow_quota_period_split_total[5m]) > 0"
          for: 1m
          labels:
            severity: critical
            team: agentflow
            batch: "4"
          annotations:
            summary: "月度额度跨月劈月（AF-5：Java CST 月与 SQL UTC 月不一致）"
            description: "period 必须由注入的 PeriodClock 统一计算后传参，任何 SQL 不得用 NOW() 算账期。"

        - alert: AgentFlowLeaseTakeoverSlow
          expr: "job:agentflow_lease_takeover_p99:seconds > 30"
          for: 5m
          labels:
            severity: warning
            team: agentflow
            batch: "4"
          annotations:
            summary: "租约接管 p99 > 30s（Redis 半开 / 关停 drain 异常）"
            description: "检查 redis socket_timeout、renew 的 wait_for、shutdown 是否先 drain 在途 _tasks。"

        - alert: AgentFlowProjectionLag
          expr: "agentflow_projection_lag_seconds > 5"
          for: 10m
          labels:
            severity: warning
            team: agentflow
            batch: "4"
          annotations:
            summary: "事件流到 MySQL 投影延迟 > 5s"
            description: "确认 EventProjector 单实例租约（LeaderElector I3）与消费堆积。"

        - alert: AgentFlowPreviewResumed
          expr: "increase(agentflow_preview_resumed_total[5m]) > 0"
          for: 1m
          labels:
            severity: critical
            team: agentflow
            batch: "4"
          annotations:
            summary: "preview 被恢复扫描续跑（AF-6，可能重复调用模型/重复计费）"
            description: "确认 preview 打标、finally 强制终态、恢复扫描跳过 preview spec。"

        - alert: AgentFlowEngineReadinessDown
          expr: "agentflow_engine_ready_status == 0"
          for: 2m
          labels:
            severity: critical
            team: agentflow
            batch: "4"
          annotations:
            summary: "引擎 readiness 非 200（PG / Redis 依赖 down）"
            description: "readiness 必须探真实依赖；依赖 down 返回 503 由编排器摘除实例。"

        - alert: AgentFlowGatewayWhitelistBreach
          expr: "increase(agentflow_gateway_whitelist_bypass_total[5m]) > 0"
          for: 1m
          labels:
            severity: critical
            team: agentflow
            batch: "4"
          annotations:
            summary: "/engine/** 白名单外路径被放行或客户端内部令牌未被剥离（AF-3）"
            description: "网关应剥离 X-Internal-Token 并由服务端注入 engine.internal-token。"
