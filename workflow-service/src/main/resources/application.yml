server:
  port: ${AF_WORKFLOW_PORT:8084}

spring:
  application:
    name: workflow-service
  servlet:
    multipart:
      enabled: false
  datasource:
    # 生产设置 AF_PRODUCTION=true 时必须同时置 AF_MYSQL_USE_TLS=true 并移除 allowPublicKeyRetrieval
    url: jdbc:mysql://${AF_MYSQL_HOST:127.0.0.1}:${AF_MYSQL_PORT:3307}/agentflow?useSSL=${AF_MYSQL_USE_TLS:false}&requireSSL=${AF_MYSQL_USE_TLS:false}&serverTimezone=UTC&allowPublicKeyRetrieval=${AF_MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&characterEncoding=UTF-8
    username: ${AF_MYSQL_USER:root}
    password: ${AF_MYSQL_PASSWORD:root}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      url: redis://${AF_REDIS_HOST:127.0.0.1}:${AF_REDIS_PORT:6379}/0
  jackson:
    default-property-inclusion: non_null

agentflow:
  jwt:
    secret: ${AF_JWT_SECRET:dev-only-secret-key-0123456789abcdef}
    ttl-seconds: ${AF_JWT_TTL_SECONDS:900}
    refresh-ttl-days: ${AF_REFRESH_TTL_DAYS:14}
    bcrypt-strength: ${AF_BCRYPT_STRENGTH:12}
    # 默认 secure=true：生产/HTTPS 下 refresh Cookie 必须带 Secure。
    # 本地 HTTP 演示由 scripts/start-dev.* 显式设为 false，避免 login 后 Cookie 不回传。
    cookie-secure: ${AF_COOKIE_SECURE:true}
  gateway:
    base-url: ${AF_GATEWAY_BASE:http://127.0.0.1:8080}
    internal-token: ${AF_INTERNAL_TOKEN:dev-internal-token}
  engine:
    # 默认不预置任何 connectorId：真实连接器由 connector-service 目录按空间发现后并入授权集合。
    authorized-connectors: ${AF_AUTHORIZED_CONNECTORS:}
    poll-interval-ms: ${AF_ENGINE_POLL_INTERVAL_MS:500}
  # 登录页的演示账号提示（凭据与种子数据一致）。生产守护开启时无论此值如何都不会下发。
  demo:
    enabled: ${AF_DEMO_ACCOUNTS:true}
  tenant:
    default-token-budget: ${AF_DEFAULT_TOKEN_BUDGET:50000}
    default-max-steps: ${AF_DEFAULT_MAX_STEPS:50}
    default-deadline-ms: ${AF_DEFAULT_DEADLINE_MS:120000}
    # 成本中心月度账本初始限额（子租户有效限额沿祖先链取最小）
    monthly-call-limit: ${AF_MONTHLY_CALL_LIMIT:10000}
    monthly-token-limit: ${AF_MONTHLY_TOKEN_LIMIT:50000}
  gate:
    # 裁决 outbox 重投间隔（引擎不可达时的补偿节奏）
    relay-interval-ms: ${AF_GATE_RELAY_INTERVAL_MS:5000}
  eval:
    # 评测/AB 结果收口轮询间隔（用例执行落终态后才断言）
    poll-interval-ms: ${AF_EVAL_POLL_INTERVAL_MS:3000}
  execution:
    # 执行看护：把「永远停在运行中」的执行收口（引擎没发终态事件 / 派发丢失）
    reap:
      enabled: ${AF_REAP_ENABLED:true}
      interval-ms: ${AF_REAP_INTERVAL_MS:60000}
      initial-delay-ms: ${AF_REAP_INITIAL_DELAY_MS:45000}
      # 过了 deadline 还要等多久：给引擎自己的超时事件留出投递余量
      grace-ms: ${AF_REAP_GRACE_MS:120000}
      # PENDING 超过这么久还不动，按「派发丢失」处理
      pending-grace-ms: ${AF_REAP_PENDING_GRACE_MS:180000}
      batch: ${AF_REAP_BATCH:50}
  audit:
    # 出口：auto（MQ 开则走 MQ，否则直写审计表）/ mq / direct
    sink: ${AF_AUDIT_SINK:auto}
    # outbox 重投节奏与降级阈值（连续失败 N 次后改直写，避免积压成黑洞）
    relay-interval-ms: ${AF_AUDIT_RELAY_INTERVAL_MS:2000}
    relay-initial-delay-ms: ${AF_AUDIT_RELAY_INITIAL_DELAY_MS:4000}
    degrade-after-attempts: ${AF_AUDIT_DEGRADE_AFTER_ATTEMPTS:3}
    purge-cron: "${AF_AUDIT_PURGE_CRON:0 30 4 * * *}"
  rocketmq:
    enabled: ${AF_MQ_ENABLED:false}
    namesrv: ${AF_ROCKETMQ_NAMESRV:127.0.0.1:9876}
    topic: af-audit-event
    # 裁决广播：引擎消费后自行续跑（与 HTTP 回调并行的第二条通道）
    gate-topic: ${AF_ROCKETMQ_GATE_TOPIC:af-gate-decision}
    producer-group: af-workflow-producer

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %logger{24} traceId=%mdc{traceId} %msg%n"
